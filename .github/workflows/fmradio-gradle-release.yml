name: FMRadio Gradle Release (signed + publish)

# Trigger manually or whenever you push a tag like 1.2.3 (or any tag)
on:
  workflow_dispatch:
  push:
    tags:
      - '*'     

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK (cmdline tools, platform-tools)
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      # --- generate a temporary keystore on the runner (no secrets needed) ---
      - name: Generate temporary signing keystore
        run: |
          mkdir -p signing
          keytool -genkeypair \
            -alias fmradioKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=FMRadio,O=CI,C=US" \
            -keystore signing/fmradio-release.keystore

      # --- Build the release APK(s) ---
      - name: Build release APK
        run: |
          # If your project needs a specific Gradle task or flavor, change assembleRelease to the correct task.
          ./gradlew --no-daemon clean assembleRelease

      # --- Sign using injected properties (Gradle will pick these if the build is configured to use them) ---
      # Many projects accept the -Pandroid.injected.* signing props; if yours uses a signingConfig in gradle, the above keystore will be used automatically by Gradle when these props are present.
      # If your Gradle config hardcodes signingConfig, you may need to adapt the build.gradle to accept external props or use apksigner step below.
      - name: Ensure release APK exists
        run: |
          echo "Looking for APKs under app/build/outputs/apk"
          find app/build/outputs/apk -type f -name "*.apk" -maxdepth 5 || true

      # If the release APK is unsigned (ends with -unsigned.apk) we sign it with apksigner
      - name: Sign APKs if unsigned (apksigner)
        run: |
          set -e
          mkdir -p signed-apks || true
          for apk in $(find app/build/outputs/apk -type f -name "*release*.apk"); do
            fname=$(basename "$apk")
            if [[ "$fname" == *unsigned* || "$fname" != *aligned* ]]; then
              echo "Signing $apk -> signed-apks/$fname"
              # Ensure zipalign is available
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              zipalign -v -p 4 "$apk" "$apk.aligned" || cp "$apk" "$apk.aligned" || true
              apksigner sign --ks signing/fmradio-release.keystore --ks-pass pass:password --key-pass pass:password --out signed-apks/"$fname" "$apk.aligned" || apksigner sign --ks signing/fmradio-release.keystore --ks-pass pass:password --key-pass pass:password "$apk"
            else
              echo "Copying pre-signed $apk"
              cp "$apk" signed-apks/"$fname"
            fi
          done
          ls -lah signed-apks || true

      - name: Upload signed APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmradio-release-apks
          path: signed-apks/*.apk

      - name: Publish GitHub Release and attach APKs
        uses: softprops/action-gh-release@v2
        with:
          files: signed-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
